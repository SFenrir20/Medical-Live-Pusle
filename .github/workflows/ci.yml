name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: livepulse
          POSTGRES_PASSWORD: livepulse
          POSTGRES_DB: livepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U livepulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e backendProj=`pwd`/backend 2>/dev/null || pip install -e ./backend[dev]
        working-directory: .
      - run: ruff check src tests
        working-directory: backend
      - run: pytest -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://livepulse:livepulse@localhost:5432/livepulse

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
        working-directory: apps/mobile
      - run: npm run lint --if-present
        working-directory: apps/mobile
      - run: npm run typecheck --if-present
        working-directory: apps/mobile
      - run: npm test -- --ci
        working-directory: apps/mobile

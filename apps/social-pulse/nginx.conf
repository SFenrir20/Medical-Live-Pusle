server {
    listen 80;
    client_max_body_size 6m;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # One public prefix (/api) for every client. The backend serves its routes as:
    #   /health, /v1/...  (legacy)      /api/auth, /api/leads, /api/marketing, ...  (Social Pulse)
    location = /api/health {
        proxy_pass http://api:8000/health;
    }
    location /api/v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The callback query contains a single-use credential. Do not put it in access logs.
    location = /api/integrations/tiktok/callback {
        access_log off;
        proxy_pass http://api:8000/api/integrations/tiktok/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

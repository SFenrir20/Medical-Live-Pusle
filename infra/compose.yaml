services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: livepulse
      POSTGRES_PASSWORD: livepulse
      POSTGRES_DB: livepulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livepulse -d livepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: medical-livepulse-api:local
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://livepulse:livepulse@db:5432/livepulse
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-[]}
      CLERK_ROLES_CLAIM: ${CLERK_ROLES_CLAIM:-metadata}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-[]}
      MEDICAL360_TOKEN: ${MEDICAL360_TOKEN:-}
      MEDICAL360_EXPORT_TOKEN: ${MEDICAL360_EXPORT_TOKEN:-}
      SOCIAL_LIVE_TOKEN: ${SOCIAL_LIVE_TOKEN:-}
      COMMENTS_RETENTION_DAYS: ${COMMENTS_RETENTION_DAYS:-30}
      ALERT_SAME_LIVE_MINUTES: ${ALERT_SAME_LIVE_MINUTES:-10}
      REMINDER_FIRST_MINUTES: ${REMINDER_FIRST_MINUTES:-10}
      REMINDER_SECOND_MINUTES: ${REMINDER_SECOND_MINUTES:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      TIKTOK_TOKEN_ENCRYPTION_KEY: ${TIKTOK_TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Sole frontend. Dokploy domain service: web; container port: 80.
  web:
    image: medical-social-pulse-web:local
    build:
      context: ../apps/social-pulse
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_API_URL: /api
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: medical-livepulse-api:local
    profiles: ["tools"]
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://livepulse:livepulse@db:5432/livepulse
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  monitor:
    image: medical-livepulse-monitor:local
    profiles: ["live"]  # captura TikTok real: `--profile live up -d monitor` (no arranca en CI)
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: Dockerfile.monitor
    environment:
      DATABASE_URL: postgresql+asyncpg://livepulse:livepulse@db:5432/livepulse
      TIKTOK_ACCOUNTS: '${TIKTOK_ACCOUNTS:-{"medical": "medical.cirugias", "medical-2": "medical.cirugias2"}}'
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: medical-livepulse-worker:local
    profiles: ["live"]
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://livepulse:livepulse@db:5432/livepulse
      COMMENTS_RETENTION_DAYS: ${COMMENTS_RETENTION_DAYS:-30}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
